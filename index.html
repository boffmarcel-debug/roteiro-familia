  --red:#FF6B6B;--red-soft:#351919;
  --sign:#000000;--sign-ink:#FFFFFF;
  --m-water:#132029;--m-land:#232422;--m-nj:#1D1E1C;--m-park:#1C3021;--m-road:#3A3B37;--m-road-minor:#2F302D;
  --m-bridge:#4A4944;--m-hl:#3E8E57;--m-label:#A3A097;--m-label-strong:#CFCCC3;--m-water-label:#6F93A8;
  --m-park-label:#79A884;--m-road-label:#8E8B83;--m-halo:#1E1F1D;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--blue-ink);-webkit-tap-highlight-color:transparent}
p,h1,h2,h3{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3);font-size:13px}

/* ---------- estrutura ---------- */
.app{height:100%;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) var(--nav-h)}
.topbar{position:relative;z-index:40;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-t{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand-d{font-size:11.5px;font-weight:700;color:var(--ink-2);padding:3px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.tabs-d{display:none}
.top-sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px}
.icon-btn:hover{background:var(--surface-2)}
.layout{position:relative;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:0 0 42%;min-height:190px;overflow:hidden;background:var(--m-water)}
#map{position:absolute;inset:0;z-index:0}
.panel{position:relative;z-index:2;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-top:-18px;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(20,20,15,.07);padding:18px 16px 36px}
.app[data-tab="mapa"] .mapwrap{flex:1 1 auto}
.app[data-tab="mapa"] .panel{display:none}
.view[hidden]{display:none}
.bottomnav{position:relative;z-index:60;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.nav-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.nav-b span:first-child{font-size:19px;line-height:1;filter:grayscale(1);opacity:.75}
.nav-b.is-active{color:var(--ink)}
.nav-b.is-active span:first-child{filter:none;opacity:1}
.nav-b.is-active::after{content:'';position:absolute;top:0;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--blue);transform:translateX(-50%)}

/* ---------- sobre o mapa ---------- */
.mchips{position:absolute;z-index:5;top:10px;left:0;right:0;display:flex;gap:8px;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;height:34px;padding:0 13px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(20,20,15,.08);white-space:nowrap}
.mchip.is-active{background:var(--ink);color:var(--bg);box-shadow:none}
.fabs{position:absolute;z-index:5;right:12px;bottom:30px;display:flex;flex-direction:column;gap:8px}
.app:not([data-tab="mapa"]) .fabs{flex-direction:row}
.app[data-tab="mapa"] .fabs{bottom:20px}
.fab{width:42px;height:42px;border-radius:13px;background:var(--surface);display:grid;place-items:center;font-size:18px;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(20,20,15,.12)}
.fab.is-on{background:var(--ink);color:var(--bg)}
.expand{position:absolute;z-index:5;left:12px;bottom:30px;height:36px;padding:0 12px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:600;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(20,20,15,.12)}
.app[data-tab="mapa"] .expand{display:none}
.map-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2);background:var(--m-land);font-size:14px}

/* ---------- Leaflet ---------- */
.leaflet-container{background:var(--m-water);font-family:var(--font);outline:none}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-3)}
.leaflet-control-attribution a{color:var(--ink-2)}
.app:not([data-tab="mapa"]) .leaflet-bottom{bottom:18px}
.lf-land{fill:var(--m-land)}
.lf-nj{fill:var(--m-nj)}
.lf-park{fill:var(--m-park)}
.lf-major{stroke:var(--m-road);stroke-width:1.2px}
.lf-minor{stroke:var(--m-road-minor);stroke-width:0}
.zge14 .lf-major{stroke-width:2.2px}.zge15 .lf-major{stroke-width:3.6px}.zge16 .lf-major{stroke-width:5.5px}.zge17 .lf-major{stroke-width:8px}
.zge14 .lf-minor{stroke-width:.8px}.zge15 .lf-minor{stroke-width:1.6px}.zge16 .lf-minor{stroke-width:3px}.zge17 .lf-minor{stroke-width:5px}
.lf-bridge{stroke:var(--m-bridge);stroke-width:2.5px}
.zge14 .lf-bridge{stroke-width:4px}.zge16 .lf-bridge{stroke-width:7px}
.lf-hl{stroke:var(--m-hl);stroke-width:2.5px}
.zge15 .lf-hl{stroke-width:5px}
.lf-sub{stroke-opacity:.6}
.zge15 .lf-sub{stroke-width:3.5px}
.leg-on .lf-sub{stroke-opacity:.22}
.rt-case{stroke:var(--surface)}
.leg-on .rt-walk:not(.strong),.leg-on .rt-train:not(.strong),.leg-on .rt-case:not(.strong),.leg-on .rt-tram:not(.strong){stroke-opacity:.18}
.lbl span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:600;color:var(--m-label);letter-spacing:.05em;text-transform:uppercase;text-shadow:0 0 2px var(--m-halo),0 0 3px var(--m-halo),0 0 6px var(--m-halo);pointer-events:none}
.lbl-boro span{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--m-label-strong)}
.lbl-water span{font-style:italic;font-weight:500;letter-spacing:.08em;text-transform:none;color:var(--m-water-label)}
.lbl-park span{text-transform:none;letter-spacing:.01em;color:var(--m-park-label)}
.lbl-road span{font-size:10.5px;text-transform:none;letter-spacing:.01em;color:var(--m-road-label)}
.mz13,.mz14,.mz15,.mz16,.mz17{display:none}
.zge13 .mz13,.zge14 .mz14,.zge15 .mz15,.zge16 .mz16,.zge17 .mz17{display:block}

/* pins */
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);cursor:pointer}
.pin-dot{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--surface);font-size:16px;line-height:1;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.2);transition:transform .15s ease}
.pin.num .pin-dot{width:28px;height:28px;background:var(--ink);color:var(--bg);font:700 13px/1 var(--font);border:2px solid var(--surface)}
.pin.is-next .pin-dot{background:var(--blue);color:#fff}
.pin.is-now .pin-dot{background:var(--blue);color:#fff;animation:pulse 2s infinite}
.pin.is-done .pin-dot{background:var(--surface);color:var(--green);border:2px solid var(--green)}
.pin.is-skip .pin-dot{opacity:.45}
.pin.is-visited .pin-dot{box-shadow:0 0 0 2px var(--green),0 2px 6px rgba(0,0,0,.2)}
.pin.hotel .pin-dot{width:38px;height:38px;background:var(--ink);font-size:19px;border:2px solid var(--surface)}
.pin.is-selected .pin-dot{transform:scale(1.18);box-shadow:0 0 0 3px var(--blue),0 4px 12px rgba(0,0,0,.25)}
.pin-fav{position:absolute;right:-6px;top:-7px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#E0245E;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin-lbl{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:650;color:var(--ink);text-shadow:0 0 2px var(--m-halo),0 0 3px var(--m-halo),0 0 6px var(--m-halo);display:none;pointer-events:none}
.zge15 .pin-lbl,.pin.hotel .pin-lbl,.pin.is-selected .pin-lbl{display:block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,99,255,.5),0 2px 6px rgba(0,0,0,.2)}70%{box-shadow:0 0 0 12px rgba(20,99,255,0),0 2px 6px rgba(0,0,0,.2)}100%{box-shadow:0 0 0 0 rgba(20,99,255,0),0 2px 6px rgba(0,0,0,.2)}}
.stn{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:none;cursor:pointer}
.stn-dot{display:block;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #1B1B1A;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.stn-lbl{display:none;position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:650;white-space:nowrap;color:var(--ink);text-shadow:0 0 2px var(--m-halo),0 0 3px var(--m-halo),0 0 6px var(--m-halo)}
.show-stn .stn,.zge16 .stn,.stn.is-hl{display:block}
.zge16 .stn-lbl,.show-stn.zge15 .stn-lbl,.stn.is-hl .stn-lbl{display:block}
.stn.is-hl .stn-dot{width:18px;height:18px;border-color:var(--blue);box-shadow:0 0 0 6px rgba(20,99,255,.22)}
.me{position:absolute;left:0;top:0;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 8px rgba(20,99,255,.18),0 1px 4px rgba(0,0,0,.3)}

/* ---------- roteiro ---------- */
.intro{padding:4px 2px 14px}
.intro-t{font-size:27px;line-height:1.08;font-weight:800;letter-spacing:-.035em}
.intro-s{margin-top:6px;color:var(--ink-2);max-width:42ch}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1)}
.hero-k{font-size:13px;font-weight:650;color:var(--blue-ink)}
.hero-title{margin-top:4px;font-size:22px;line-height:1.15;font-weight:750;letter-spacing:-.025em}
.hero-sub{margin-top:8px;color:var(--ink-2)}
.hero-actions,.hero-btns,.btn-row,.sh-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-now,.hero-next{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.hero-now{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-now>div{flex:1;min-width:140px}
.hero-dot{width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(20,99,255,.2);flex:none}
.hero-lbl{font-size:12.5px;font-weight:650;color:var(--ink-3)}
.hero-place{font-size:17px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.hero-leg{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hotel-strip{margin-top:12px;width:100%;display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.hotel-strip span:first-child{color:var(--ink);font-weight:650}
.days{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{position:relative;flex:none;width:62px;padding:8px 0 9px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px}
.dchip-w{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-3)}
.dchip-n{font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.dchip-l{font-size:11px;font-weight:550;color:var(--ink-3)}
.dchip.is-active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.is-active .dchip-w,.dchip.is-active .dchip-l{color:inherit;opacity:.72}
.dchip.is-today::after{content:'';position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.daycard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.day-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-n{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--blue-ink)}
.day-date{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.day-title{margin-top:6px;font-size:24px;line-height:1.1;font-weight:750;letter-spacing:-.03em}
.day-intro{margin-top:6px;color:var(--ink-2)}
.day-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.day-meta span{font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.day-kids{margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.daycard .btn{margin-top:12px}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 12px;border-radius:12px;font-size:13.5px;line-height:1.42}
.alert>span{flex:none;line-height:1.35}
.alert-warn,.alert-tip{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-ink)}
.alert-info{background:var(--blue-soft);border:1px solid var(--blue-line);color:var(--blue-ink2)}
.alert-danger{background:var(--red-soft);border:1px solid var(--red);color:var(--red)}

.tl{position:relative;list-style:none;margin:14px 0 0;padding:0}
.tl::before{content:'';position:absolute;left:68px;top:26px;bottom:26px;width:2px;background:var(--line)}
.tl-row,.tl-leg,.tl-extra{position:relative}
.tl-btn{width:100%;display:grid;grid-template-columns:44px 30px minmax(0,1fr) auto;align-items:start;gap:0 10px;padding:10px 0;text-align:left;border-radius:14px}
.tl-time{font-size:13px;font-weight:650;color:var(--ink-2);padding-top:6px;font-variant-numeric:tabular-nums;text-align:right}
.tl-node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:13px;font-weight:750}
.tl-node-hotel{background:var(--surface);border:1px solid var(--line);font-size:15px}
.tl-main{display:flex;flex-direction:column;min-width:0;padding:4px 0 0 10px}
.tl-name{font-size:16px;font-weight:700;letter-spacing:-.012em}
.tl-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.tl-tip{font-size:13px;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-state{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:999px;margin-top:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.is-next .tl-node{background:var(--blue);color:#fff}
.is-next .tl-state{background:var(--blue-soft);color:var(--blue-ink);border-color:var(--blue-line)}
.is-now .tl-node{background:var(--blue);color:#fff;box-shadow:0 0 0 5px rgba(20,99,255,.2)}
.is-now .tl-state{background:var(--blue);color:#fff;border-color:var(--blue)}
.is-done .tl-node{background:var(--green-soft);color:var(--green)}
.is-done .tl-name{color:var(--ink-2)}
.is-done .tl-state{background:var(--green-soft);color:var(--green);border-color:transparent}
.is-skip .tl-name{text-decoration:line-through;color:var(--ink-3)}
.is-skip .tl-node{opacity:.45}
.tl-fav{color:#E0245E;margin-left:6px;font-size:13px}
.tl-opt{margin-left:8px;font-size:11px;font-weight:650;color:var(--ink-3);border:1px dashed var(--line);border-radius:6px;padding:1px 5px;vertical-align:2px;white-space:nowrap}
.tl-leg{padding:2px 0 2px 104px}
.tl-leg::before{content:'';position:absolute;left:67.5px;top:0;bottom:0;width:3px;background:repeating-linear-gradient(to bottom,var(--green) 0 3px,transparent 3px 8px);z-index:1}
.tl-leg.is-transit::before{background:var(--blue);width:4px;left:67px;border-radius:2px}
.tl-legbtn{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tl-legbtn:hover{border-color:var(--ink-3)}
.tl-go{margin-left:4px;color:var(--blue-ink);font-weight:750}
.tl-extra{padding:6px 0 8px 104px}
.lc{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lc-walk{color:var(--green-ink)}
.lc-tram{color:#B8102A}
.lc-sep{width:8px;height:1px;background:var(--ink-3);opacity:.5}
.lc-txt{color:var(--ink-3);font-weight:500}
.lns{display:inline-flex;gap:3px}
.ln{--s:26px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font:700 calc(var(--s)*.6)/1 var(--font-sign);flex:none}
.ln.dk{color:#1A1A1A}
.ln.sm{--s:20px}
.ln.xs{--s:17px}
.xcard,.opt{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.xcard-t,.opt-t{font-weight:750;color:var(--ink);font-size:14px}
.opts{display:grid;gap:8px}
.depart{border:1.5px solid var(--ink);border-radius:16px;padding:14px;background:var(--surface)}
.depart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.depart-t{font-weight:750}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg-b{padding:6px 11px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg-b.is-active{background:var(--ink);color:var(--bg)}
.depart-times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.depart-times>div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--surface-2)}
.depart-times b{font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.depart-times span{font-size:12px;color:var(--ink-3);font-weight:600}

/* ---------- cartões, linhas e botões ---------- */
.card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card-t{font-size:17px;font-weight:750;letter-spacing:-.015em}
.card>.muted{margin-top:4px}
.card>p{margin-top:6px;font-size:14px;color:var(--ink-2)}
.rows{display:flex;flex-direction:column;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line-2);width:100%;text-align:left}
.row:first-child{border-top:0}
.row-i{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:17px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-main b{font-weight:650;font-size:15px}
.row-meta{flex:none;font-size:12.5px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.trip-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:650;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn.is-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.is-on.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.link{color:var(--blue-ink);font-weight:650;font-size:13.5px;text-decoration:none}
.link:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.chip-day{color:var(--blue-ink);border-color:var(--blue-line);background:var(--blue-soft)}
.chip-conf,.badge-conf{color:var(--amber-ink);background:var(--amber-soft);border:1px solid var(--amber-line)}
.badge-conf{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
input[type=time],input[type=text],input[type=tel],input[type=search],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;color:var(--ink);font-size:16px}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
textarea{width:100%;resize:vertical;min-height:84px;line-height:1.4}
.tickets{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticket{border:1px solid var(--line-2);border-radius:14px;padding:12px;background:var(--surface-2)}
.ticket-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ticket-n{font-weight:700}
.pill-toggle{flex:none;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber-line)}
.pill-toggle.is-ok{background:var(--green);color:#fff;border-color:var(--green)}
.ticket-f{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:10px}
.ticket-f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-3);min-width:0}
.ticket-f input{width:100%}
.ticket-links{display:flex;gap:16px;margin-top:10px}
.info{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.info-r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.info-r.col{flex-direction:column;align-items:stretch;gap:6px}
.info-n{font-weight:700;font-size:14.5px}
.info-in{display:flex;gap:8px}
.info-in input{flex:1;min-width:0}
.foot{margin:18px 2px 0;font-size:12px;color:var(--ink-3)}

/* ---------- metrô e lugares ---------- */
.sec-head{padding:4px 2px 0}
.sec-t{font-size:25px;font-weight:800;letter-spacing:-.03em}
.sec-head .muted{margin-top:4px;font-size:14px}
.rule-t{display:grid;gap:10px;margin-top:12px}
.rule-t>div{border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.rule-h{font-weight:750;font-size:13px}
.rule-t .ln{margin-right:6px;vertical-align:-5px}
.tips{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.tip{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14px;color:var(--ink-2)}
.tip-i{font-size:19px;line-height:1.2}
.tip-t{font-weight:700;color:var(--ink)}
.search{position:sticky;top:-18px;z-index:3;background:var(--bg);padding:2px 0 8px}
.search input{width:100%;height:46px;border-radius:14px;padding:0 14px}
.kgrid{display:grid;gap:10px;margin-top:12px}
.kcard{border:1px solid var(--line-2);border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.kcard-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.kcard-n{font-weight:750;font-size:16px;color:var(--ink)}
.kcard-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;font-weight:600;align-items:center}
.kcard .btn-row{margin-top:4px}
.ess-list{display:flex;flex-direction:column;margin-top:8px}
.ess{display:grid;grid-template-columns:36px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line-2)}
.ess:first-child{border-top:0}
.ess-i{font-size:19px;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface-2)}
.ess-n{font-weight:700}
.ess-links{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.area{border-top:1px solid var(--line-2)}
.area:first-of-type{border-top:0;margin-top:4px}
.area summary{cursor:pointer;padding:12px 2px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.area summary::-webkit-details-marker{display:none}
.area summary .muted{margin-left:auto;margin-right:10px}
.area summary::after{content:'+';color:var(--ink-3);font-weight:500;font-size:18px;line-height:1}
.area[open] summary::after{content:'–'}

/* ---------- painel inferior (sheet) ---------- */
.sheet{position:fixed;z-index:50;left:0;right:0;top:var(--sheet-top,50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--line),0 -12px 32px rgba(20,20,15,.16);transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet.dragging{transition:none}
.sheet-grab{flex:none;height:24px;width:100%;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet-grab::before{content:'';width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 28px;outline:none}
.sh-head{position:relative;padding:2px 44px 4px 0}
.sh-x{position:absolute;right:-4px;top:-4px;width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;font-size:14px;color:var(--ink-2)}
.sh-k{font-size:12.5px;font-weight:650;color:var(--ink-3)}
.sh-title{font-size:22px;line-height:1.15;font-weight:750;letter-spacing:-.025em;margin-top:2px}
.sh-sum{margin-top:6px;font-size:15px;font-weight:650;color:var(--ink-2)}
.sh-addr{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.sh-sec{margin-top:18px}
.sh-lbl{display:block;font-size:13px;font-weight:750;color:var(--ink-2);margin-bottom:6px}
.sh-tip{display:flex;gap:10px;margin-top:14px;padding:12px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-ink);font-size:14px}
.st-lines{margin-top:10px}
.prog{margin-top:16px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2)}
.prog-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog .sh-lbl{margin:0}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.st-agora{background:var(--blue);color:#fff;border-color:var(--blue)}
.st-visitado{background:var(--green-soft);color:var(--green);border-color:transparent}
.st-pulado{color:var(--ink-3)}
.prog-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.time-edit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.driver{padding:20px 2px}
.driver-n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.driver-a{margin-top:14px;font-size:30px;line-height:1.2;font-weight:650}

/* fluxo de navegação no estilo das placas do metrô */
.flow{list-style:none;margin:16px 0 0;padding:0}
.fl{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 12px;padding-bottom:16px}
.fl:last-child{padding-bottom:4px}
.fl-rail{position:absolute;left:17px;top:30px;bottom:0;width:2px}
.o-walk .fl-rail{width:3px;left:16.5px;background:repeating-linear-gradient(to bottom,var(--green) 0 4px,transparent 4px 9px)}
.o-train .fl-rail{width:8px;left:14px;top:22px;bottom:-8px;border-radius:4px;background:var(--c)}
.o-tram .fl-rail{width:4px;left:16px;background:repeating-linear-gradient(to bottom,#C8102E 0 8px,transparent 8px 13px)}
.fl-node{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:16px}
.fl-node.ring{width:24px;height:24px;margin:6px;background:var(--surface);border:4px solid var(--c)}
.fl-body{padding-top:6px;min-width:0}
.fl-t{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.fl-s{margin-top:3px;font-size:13.5px;color:var(--ink-2)}
.sign{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--sign);color:var(--sign-ink);font-family:var(--font-sign)}
.sign-dir{font-size:15px;font-weight:700;letter-spacing:.005em}
.fl-stops{margin-top:6px;font-size:13px;color:var(--ink-2)}
.fl-stops summary{cursor:pointer;color:var(--blue-ink);font-weight:650}
.fl-stops ol{margin:6px 0 0;padding-left:18px}
.mta-note{margin-top:14px;font-size:12.5px;color:var(--ink-3)}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:650;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .app{grid-template-rows:var(--top-h) minmax(0,1fr)}
  .bottomnav{display:none}
  .tabs-d{display:flex;gap:2px;margin-left:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
  .tab-d{padding:6px 14px;border-radius:9px;font-size:14px;font-weight:650;color:var(--ink-2)}
  .tab-d.is-active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .layout{display:grid;grid-template-columns:var(--panel-w) minmax(0,1fr)}
  .panel{grid-column:1;grid-row:1;margin:0;border-radius:0;box-shadow:none;border-right:1px solid var(--line);padding:22px 22px 40px}
  .mapwrap{grid-column:2;grid-row:1;min-height:0}
  .app[data-tab] .panel{display:block}
  .fabs,.app:not([data-tab="mapa"]) .fabs{flex-direction:column;right:16px;bottom:28px}
  .expand{display:none}
  .leaflet-control-zoom{display:block}
  .app:not([data-tab="mapa"]) .leaflet-bottom{bottom:0}
  .days{margin:16px -22px 0;padding:2px 22px 6px}
  .search{top:-22px}
  .sheet{left:0;right:auto;width:var(--panel-w);top:calc(var(--top-h) + env(safe-area-inset-top,0px));bottom:env(safe-area-inset-bottom,0px);border-radius:0;box-shadow:1px 0 0 var(--line),14px 0 32px rgba(20,20,15,.08);transform:translateX(-104%)}
  .sheet.open{transform:translateX(0)}
  .sheet-grab{display:none}
  .sheet-body{padding:22px 22px 32px}
  .toast{bottom:24px;left:calc(var(--panel-w) + (100% - var(--panel-w)) / 2)}
  .rule-t{grid-template-columns:1fr 1fr}
  .intro-t{font-size:31px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* onde comer e plano B */
.price{display:inline-block;margin-left:7px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--green-ink);vertical-align:1px}
.day-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.daycard .day-links .btn{margin-top:0}
.rain{background:var(--blue-soft);border-color:var(--blue-line)}
.rain p{margin-top:8px;font-size:14px;color:var(--blue-ink2)}
.rain .chips{margin-top:12px}
.rain .btn-row{margin-top:12px}
.chip-go{cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:var(--surface);color:var(--ink);border-color:var(--line);text-decoration:none}
.chip-go:hover{border-color:var(--ink-3)}
#comer-dia .btn{margin-top:10px}

/* ---------- UX v2 ---------- */
.app{grid-template-columns:minmax(0,1fr)}
.layout,.panel,.view,.mapwrap{min-width:0}
.bottomnav{grid-template-columns:repeat(5,1fr)}
.nav-b{font-size:11px}
.days{position:sticky;top:0;z-index:4;background:var(--bg);margin:-18px -16px 0;padding:12px 16px 10px;box-shadow:0 1px 0 var(--line-2)}
.hero{margin-top:12px}
.hero-sm{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding:14px 16px}
.hero-sm .hero-title{font-size:18px;margin-top:2px}
.hero-sm .hero-sub{margin-top:2px;font-size:13.5px}
.hero .hero-k + .hero-now,.hero .hero-k + .hero-next{border-top:0;padding-top:4px;margin-top:6px}
.hero-btns{margin-top:10px}
.hero-pill{flex:none;font-size:13px;font-weight:650;padding:8px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.day-prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.day-prog .bar{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.day-prog .bar span{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.tl-hint{margin:14px 2px 0;font-size:12.5px;color:var(--ink-3)}
.tl{margin-top:4px}
#daycard,#comer-dia,#chuva-dia,#tickets{scroll-margin-top:76px}
.mapwrap{transition:flex-basis .3s ease}
.app.map-min:not([data-tab="mapa"]) .mapwrap{flex-basis:21%;min-height:128px}
.mchips,.fabs{transition:opacity .2s}
.app.map-min:not([data-tab="mapa"]) .mchips,.app.map-min:not([data-tab="mapa"]) .fabs{opacity:0;pointer-events:none}
.nextbar{display:none}
.app[data-tab="mapa"] .nextbar{display:block;position:absolute;z-index:5;left:12px;right:66px;bottom:16px}
.nextbar:empty{display:none!important}
.nb{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(20,20,15,.16)}
.nb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.nb-k{font-size:12px;font-weight:650;color:var(--blue-ink)}
.nb-t{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-leg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--ink-2);margin-top:2px}
.nb .btn{flex:none}
.app[data-tab="mapa"] .leaflet-bottom.leaflet-right{bottom:auto;top:50px}
.fab svg,.sh-x svg{display:block}
.fab{color:var(--ink)}
.lug-top{position:sticky;top:0;z-index:4;background:var(--bg);margin:-18px -16px 0;padding:12px 16px 10px;box-shadow:0 1px 0 var(--line-2)}
.lug-top .search{position:static;top:auto;padding:0}
.segs{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg-c{flex:none;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--ink-2)}
.seg-c.is-active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#lsec-body>.card:first-child{margin-top:12px}
#lsec-body[hidden]{display:none}
.btn.grow{flex:1 1 auto}
.sh-actions .btn{min-width:0}
.sh-links{margin-top:12px;font-size:13px;color:var(--ink-3)}
.sh-links .link{font-size:13px}
.prog-top .time-mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.time-mini input{min-height:32px;padding:4px 8px;font-size:14px}
.state-ok{display:inline-flex;align-items:center;font-weight:750;color:var(--green);margin-right:6px}
.btn-row .arrive-btn{flex-basis:100%;margin-top:2px}
@media (min-width:900px){
  .days{margin:-22px -22px 0;padding:14px 22px 10px}
  .lug-top{margin:-22px -22px 0;padding:14px 22px 10px}
  .segs{margin:10px -22px 0;padding:0 22px}
  .nextbar{display:none!important}
}
.days,.lug-top{top:-18px}
.ic{display:inline-block;vertical-align:-2px;flex:none}
.chev{transition:transform .2s}
.btn .ic,.pill-toggle .ic,.state-ok .ic{margin-right:2px}
.tl-node .ic,.pin-dot .ic{vertical-align:middle}
@media (min-width:900px){.days,.lug-top{top:-22px}}

/* ---------- UX v3 ---------- */
.late{margin-top:10px;padding:12px;border-radius:14px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-ink)}
.hero .hero-k + .late{margin-top:8px}
.late-t{font-weight:750;font-size:14.5px}
.late-s{margin-top:4px;font-size:13.5px}
.late .btn-row{margin-top:10px}
.hero-you{margin-top:4px;font-size:13px;font-weight:650;color:var(--blue-ink)}
.nb-late{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--red);color:#fff;font-size:11px;font-weight:750}
.nb-you{color:var(--blue-ink);font-weight:650}
.tk-chip{display:inline-flex;align-self:flex-start;margin-top:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber-line)}
.tk-chip.ok{background:var(--green-soft);color:var(--green-ink);border-color:transparent}
.tk-box{padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2)}
.tk-box .sh-lbl{margin:0}
.ticket-links{flex-wrap:wrap;gap:8px 16px}
.mchip-ctx{display:inline-flex;align-items:center;cursor:default}
@media (max-width:899px) and (max-height:760px){
  .mapwrap{flex-basis:34%;min-height:150px}
  .daycard{padding:14px}
  .day-title{font-size:21px}
  .hero{padding:12px 14px}
}
@media (max-width:899px) and (max-height:640px){
  .mapwrap{flex-basis:30%;min-height:140px}
  .app.map-min:not([data-tab="mapa"]) .mapwrap{flex-basis:18%;min-height:110px}
}

/* ---------- UX v4: ícones, legibilidade, passo a passo, agrupamento, checklist ---------- */
:root{--ink-2:#4A4945;--ink-3:#6C6A64}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink-2:#C6C4BD;--ink-3:#9E9C95}}
:root[data-theme="dark"]{--ink-2:#C6C4BD;--ink-3:#9E9C95}
.ico{display:inline-block;vertical-align:-4px;flex:none}
.btn .ico{width:18px;height:18px}
.btn.sm .ico{width:16px;height:16px;vertical-align:-3px}
.chip .ico,.mchip .ico,.hero-pill .ico{width:15px;height:15px;vertical-align:-3px}
.row-i .ico{width:19px;height:19px}
.ic-c{display:inline-flex;align-items:center;justify-content:center}
.nav-b{color:var(--ink-3)}
.nav-b span:first-child{filter:none;opacity:1;display:grid;place-items:center;line-height:0}
.nav-b .ico{width:23px;height:23px}
.nav-b.is-active{color:var(--ink)}
.nav-b.is-active .ico{color:var(--blue)}
.fab .ico,.icon-btn .ico{width:21px;height:21px}
.pin-dot .ico{width:17px;height:17px}
.pin.hotel .pin-dot{color:var(--bg)}
.pin.hotel .pin-dot .ico{width:20px;height:20px}
.tl-node-hotel{color:var(--ink-2)}
.tl-node-hotel .ico{width:16px;height:16px}
.fl-node .ico{width:18px;height:18px}
.fl-node{color:var(--ink-2)}

.sh-acc textarea{margin-bottom:12px}

.gd-n{font-size:13.5px;font-weight:700;color:var(--ink-3)}

.gd-sign .ln{--s:32px}
.gd-sign .sign-dir{font-size:18px}
.gd-nav{display:flex;gap:8px;margin-top:16px}
.gd-nav .btn{min-height:52px;font-size:16px}
.hero-done .hero-place{font-size:16px}
.tomorrow{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.day-done{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--green-soft);color:var(--green-ink);font-weight:650;font-size:14px}
.chk{display:flex;flex-direction:column;margin-top:8px}
.chk-i{display:flex;align-items:flex-start;gap:12px;width:100%;padding:11px 2px;border-top:1px solid var(--line-2);text-align:left}
.chk-i:first-child{border-top:0}

.chk-i.on .chk-b{background:var(--green);border-color:var(--green)}
.chk-i.on .chk-t{color:var(--ink-3);text-decoration:line-through}
.chk-t{display:block;font-size:14.5px;font-weight:600}
.chk-s{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-3)}

    if (!window.NYC_PWA || !window.fetch || navigator.onLine === false) return;
    if (!force && S.wx && Date.now() - (S.wx.at || 0) < 3 * 3600 * 1000) return;
    fetch(WX_URL).then((r) => (r.ok ? r.json() : Promise.reject(r.status))).then((j) => {
      const dd = j && j.daily; if (!dd || !dd.time) return;
      const days = {};
      dd.time.forEach((t, i) => { days[t] = { c: dd.weather_code ? dd.weather_code[i] : null, tx: dd.temperature_2m_max[i], tn: dd.temperature_2m_min[i], pp: dd.precipitation_probability_max ? dd.precipitation_probability_max[i] : null }; });
      S.wx = { at: Date.now(), days: Object.assign({}, (S.wx || {}).days, days) }; save();
      renderRoteiro(); renderInfo();
      if (force) toast('Previsão atualizada');
    }).catch(() => { if (force) toast('Não foi possível atualizar a previsão agora.'); });
  }
  function wxHTML(d) {
    const w = wxFor(DAYS[d].date); if (!w) return '';
    const rain = rainLikely(d);
    return '<div class="wx' + (rain ? ' wx-rain' : '') + '"><span class="wx-i" aria-hidden="true">' + wxIcon(w.c) + '</span><span class="wx-txt"><b>' + wxText(w.c) + '</b>, ' + Math.round(w.tn) + '° a ' + Math.round(w.tx) + '°' + (w.pp != null ? ', chance de chuva ' + w.pp + '%' : '') + '</span>' + (rain ? '<button class="btn sm" data-act="scroll" data-to="chuva-dia">Ver plano B</button>' : '') + '</div>';
  }
  function wxCardHTML() {
    if (!window.NYC_PWA) return '';
    const p2 = (n) => String(n).padStart(2, '0'), at = S.wx && S.wx.at ? new Date(S.wx.at) : null;
    const rows = DAYS.map((D) => { const w = wxFor(D.date), di = dinfo(D.date); return '<div class="wx-row"><span class="wx-d">' + DOW3[di.w] + ' ' + di.d + '/10</span><span class="wx-i" aria-hidden="true">' + (w ? wxIcon(w.c) : '') + '</span><span class="wx-t">' + (w ? Math.round(w.tn) + '° a ' + Math.round(w.tx) + '°' : 'ainda sem previsão') + '</span><span class="wx-p">' + (w && w.pp != null ? w.pp + '% chuva' : '') + '</span></div>'; }).join('');
    return '<section class="card"><h3 class="card-t">Previsão do tempo</h3><p class="muted">' + (at ? 'Atualizada em ' + p2(at.getDate()) + '/' + p2(at.getMonth() + 1) + ' às ' + p2(at.getHours()) + ':' + p2(at.getMinutes()) + '.' : 'A previsão de cada dia aparece até 16 dias antes.') + '</p><div class="wx-list">' + rows + '</div><div class="btn-row"><button class="btn sm" data-act="wx">Atualizar previsão</button></div><p class="muted" style="margin-top:10px">Fonte: Open-Meteo.</p></section>';
  }
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; renderInfo(); });
  function installHTML() {
    if (!window.NYC_PWA) return '';
    if (mq('(display-mode: standalone)') || window.navigator.standalone === true) return '';
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
    return '<section class="card"><h3 class="card-t">Instalar no celular</h3><p class="muted">Instalado, o roteiro, o mapa e o metrô funcionam mesmo sem internet.</p>'
      + (deferredPrompt ? '<div class="btn-row"><button class="btn primary sm" data-act="install">Instalar app</button></div>' : '<p style="margin-top:8px;font-size:14px">' + (ios ? 'No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.' : 'No Chrome, abra o menu ⋮ e toque em “Instalar app” ou “Adicionar à tela inicial”.') + '</p>') + '</section>';
  }
  function netState() { const el = $('#net'); if (el) el.hidden = navigator.onLine !== false; }

  /* ================= AÇÕES ================= */
  let toastT = null;
  function toast(msg) {
    const t = $('#toast'); if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function refreshAll() {
    renderRoteiro(); renderLugares(); renderInfo(); renderChips(); renderNextBar();
    refreshPins();
    highlight(selId);
  }
  function selectDay(d) {
    S.day = d; S.filter = 'dia'; save();
    renderRoteiro(); renderChips(); renderNextBar(); refreshPins();
    fitDayOrMoment(d);
  }
  function setFilter(f) {
    S.filter = f; save();
    renderChips(); refreshPins();
    if (f === 'dia') { fitDayOrMoment(selDay()); return; }
    if (f === 'metro') { fitIds(['hotel'], HOTEL_STATIONS.map((h) => stLL(h.id))); toast('Estações de metrô no mapa'); return; }
    const ids = visibleIds();
    if (!ids.length) { toast(f === 'salvos' ? 'Nenhum lugar salvo ainda. Toque em Salvar em um lugar.' : 'Nada para mostrar aqui.'); return; }
    fitIds(ids.concat(['hotel']));
    if (f === 'essenciais') toast('Farmácias e mercados: veja os atalhos em Lugares');
  }
  function setTab(t, init) {
    if (isDesktop() && t === 'mapa') t = 'roteiro';
    const prev = S.tab;
    S.tab = t; save();
    const app = $('#app');
    app.dataset.tab = t;
    app.classList.remove('map-min');
    $$('[data-act="tab"]').forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle('is-active', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    const shown = t === 'mapa' ? 'roteiro' : t;
    $$('.view').forEach((v) => { v.hidden = v.id !== 'view-' + shown; });
    if (!init && prev !== t) { const pn = $('#panel'); if (pn) pn.scrollTop = 0; }
    if (!init) { renderChips(); if (t === 'info') renderInfo(); if (effFor(prev) !== effFor(t)) { refreshPins(); setTimeout(fitContext, 380); } }
    if (sheet.classList.contains('open')) positionSheet();
    [60, 340].forEach((ms) => setTimeout(() => { if (map) map.invalidateSize({ pan: false }); }, ms));
  }
  function toggleFav(id) {
    if (S.fav[id]) delete S.fav[id]; else S.fav[id] = 1;
    save(); refreshAll(); reopen();
    toast(S.fav[id] ? 'Salvo em Lugares' : 'Removido dos salvos');
  }
  function toggleDone(dd, id) {
    const k = key(dd, id);
    if (S.done[k]) delete S.done[k];
    else { S.done[k] = 1; delete S.skip[k]; if (S.now[dd] === id) delete S.now[dd]; }
    save(); refreshAll(); reopen();
    toast(S.done[k] ? 'Marcado como visitado' : 'Visita desmarcada');
  }
  function arrive(d, id) {
    S.now[d] = id; delete S.skip[key(d, id)]; delete S.done[key(d, id)];
    save(); refreshAll();
    toast('Agora: ' + nm2(id, d));
    if (ctx && (ctx.type === 'leg' || ctx.type === 'guide')) openPlace(id, { d: d }); else reopen();
  }
  function finish(d, id) {
    S.done[key(d, id)] = 1; delete S.skip[key(d, id)];
    if (S.now[d] === id) delete S.now[d];
    save(); refreshAll();
    const left = DAYS[d].stops.filter((s) => !isDone(d, s[0]) && !isSkip(d, s[0])).length;
    toast(left ? 'Visitado: ' + nm2(id, d) : 'Dia ' + (d + 1) + ' concluído! 🎉');
    openLeg(d, stopIdx(d, id) + 1, false);
  }
  function skipStop(d, id) {
    const k = key(d, id);
    if (S.skip[k]) delete S.skip[k];
    else { S.skip[k] = 1; delete S.done[k]; if (S.now[d] === id) delete S.now[d]; }
    save(); refreshAll(); reopen();
    toast(S.skip[k] ? 'Parada pulada' : 'Parada de volta ao roteiro');
  }
  function gotoDay(d, id) {
    closeSheet();
    if (!isDesktop()) setTab('roteiro');
    selectDay(d);
    setTimeout(() => {
      const e = document.querySelector('[data-stop="' + d + ':' + id + '"]');
      if (e && e.scrollIntoView) e.scrollIntoView({ block: 'center', behavior: calm() ? 'auto' : 'smooth' });
    }, 90);
  }
  function nextTarget() {
    const ph = phase(), d = ph.k === 'during' ? ph.idx : selDay(), st = dayState(d);
    return { d: d, id: st.nowId || st.next };
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const a = t.dataset.act, d = t.dataset.d != null && t.dataset.d !== 'x' ? +t.dataset.d : t.dataset.d, id = t.dataset.id;
    switch (a) {
      case 'tab': setTab(t.dataset.tab); if (t.dataset.tab === 'mapa' && sheet.classList.contains('open')) positionSheet(); break;
      case 'day': selectDay(d); if (t.dataset.scroll) { const c = $('#daycard'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'start', behavior: calm() ? 'auto' : 'smooth' }); } break;
      case 'day-map': if (!isDesktop()) setTab('mapa'); S.day = d; S.filter = 'dia'; save(); renderRoteiro(); renderChips(); refreshPins(); setTimeout(() => fitDay(d), 340); break;
      case 'place': openPlace(id); break;
      case 'stop': openPlace(id, { d: d }); break;
      case 'leg': openLeg(d, +t.dataset.i, false); break;
      case 'leg-alt': if (ctx && ctx.type === 'leg') openLeg(ctx.d, ctx.i, !ctx.alt); break;
      case 'station': openStation(id); break;
      case 'focus-station': focusStation(id); if (!isDesktop() && S.tab !== 'mapa' && sheet.dataset.size === 'full') setSize('half'); break;
      case 'close': closeSheet(); break;
      case 'fav': toggleFav(id); break;
      case 'done': toggleDone(d, id); break;
      case 'arrive': arrive(d, id); break;
      case 'finish': finish(d, id); break;
      case 'skip': skipStop(d, id); break;
      case 'goto-day': gotoDay(d, id); break;
      case 'wx': toast('Atualizando previsão…'); fetchWx(true); break;
      case 'install': if (deferredPrompt) { deferredPrompt.prompt(); const dp = deferredPrompt; dp.userChoice.finally(() => { deferredPrompt = null; renderInfo(); }); } break;
      case 'net': toast('Sem internet: roteiro, mapa e metrô funcionam. Rotas do Google, Uber e previsão precisam de conexão.'); break;
      case 'guide': openGuide(d, +t.dataset.i, !!t.dataset.alt, +t.dataset.k || 0); break;
      case 'check': { S.check = S.check || {}; const c = t.dataset.c; if (S.check[c]) delete S.check[c]; else S.check[c] = 1; save(); renderInfo(); break; }
      case 'shift': { const r = shiftDay(d, +t.dataset.m); refreshAll(); toast(r.stopAt ? 'Horários ajustados até ' + nm2(r.stopAt, d) + ', que tem horário fixo' : 'Horários do dia ajustados em +' + t.dataset.m + ' min'); break; }
      case 'reset-times': Object.keys(S.times).forEach((k) => { if (k.split(':')[0] === String(d)) delete S.times[k]; }); save(); refreshAll(); toast('Horários originais restaurados'); break;
      case 'filter-go': if (!isDesktop()) setTab('mapa'); setTimeout(() => setFilter(t.dataset.f), isDesktop() ? 0 : 340); break;
      case 'filter': if (AREAS.indexOf(t.dataset.f) >= 0) showAreas = false; setFilter(t.dataset.f); break;
      case 'areas': { showAreas = !showAreas; renderChips(); const bx = $('#chips'), ca = $('.mchip-areas'); if (showAreas && bx && ca) bx.scrollLeft = Math.max(0, ca.offsetLeft - 12); break; }
      case 'lsec': { S.lsec = t.dataset.s; save(); renderLugares(); const pn = $('#panel'); if (pn) pn.scrollTop = 0; renderChips(); refreshPins(); fitContext(); break; }
      case 'reset':
        if (t.dataset.armed) { S.done = {}; S.skip = {}; S.now = {}; save(); refreshAll(); toast('Marcações de visita apagadas'); }
        else { t.dataset.armed = '1'; t.textContent = 'Toque de novo para confirmar'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Limpar marcações de visita'; } }, 4000); }
        break;
      case 'fab-hotel': openHotel(); break;
      case 'fab-next': {
        const n = nextTarget();
        if (!n.id) { toast('Roteiro do dia concluído'); break; }
        if (selDay() !== n.d || S.filter !== 'dia') { S.day = n.d; S.filter = 'dia'; save(); renderRoteiro(); renderChips(); refreshPins(); }
        openPlace(n.id, { d: n.d });
        break;
      }
      case 'fab-metro': S.stations = !S.stations; save(); syncStations(); t.classList.toggle('is-on', S.stations); toast(S.stations ? 'Estações visíveis no mapa' : 'Estações ocultas'); break;
      case 'fab-me': locateMe(true); break;
      case 'expand': setTab('mapa'); break;
      case 'search': setTab('lugares'); setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 60); break;
      case 'scroll': { const el = document.getElementById(t.dataset.to); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: calm() ? 'auto' : 'smooth' }); break; }
      case 'ticket': { const v = Object.assign({}, S.tickets[id]); v.st = v.st === 'ok' ? '' : 'ok'; S.tickets[id] = v; save(); renderRoteiro(); renderInfo(); reopen(); toast(v.st === 'ok' ? 'Ingresso marcado como comprado' : 'Ingresso marcado como pendente'); break; }
      case 'airport': S.airport = t.dataset.a; save(); renderRoteiro(); renderInfo(); if (ctx && ctx.type === 'leg' && DAYS[ctx.d].departure) openLeg(ctx.d, ctx.i, ctx.alt); toast('Aeroporto: ' + S.airport); break;
      case 'driver': openDriver(); break;
      default: break;
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target, ds = t.dataset || {};
    if (t.id === 'q') { S.q = t.value; save(); renderResults(); return; }
    if (ds.note) { if (t.value) S.notes[ds.note] = t.value; else delete S.notes[ds.note]; save(); return; }
    if (ds.tf) { const v = Object.assign({}, S.tickets[ds.id]); v[ds.tf] = t.value; S.tickets[ds.id] = v; save(); return; }
    if (ds.info) { S.info[ds.info] = t.value; save(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target, ds = t.dataset || {};
    if (ds.tf) { renderRoteiro(); renderNextBar(); return; }
    if (!ds.stime) return;
    const parts = ds.stime.split(':'), k = key(parts[0], parts[1]);
    if (t.value) S.times[k] = t.value; else delete S.times[k];
    save(); renderRoteiro(); toast('Horário atualizado');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });
  window.addEventListener('resize', () => {
    if (isDesktop() && S.tab === 'mapa') setTab('roteiro');
    if (sheet.classList.contains('open')) positionSheet();
    if (map) map.invalidateSize({ pan: false });
  });

  /* arrastar o painel no celular */
  (function () {
    const grab = $('.sheet-grab');
    let y0 = null, dy = 0;
    grab.addEventListener('pointerdown', (e) => {
      if (isDesktop()) return;
      y0 = e.clientY; dy = 0;
      try { grab.setPointerCapture(e.pointerId); } catch (x) { /* ignora */ }
      sheet.classList.add('dragging');
    });
    grab.addEventListener('pointermove', (e) => {
      if (y0 == null) return;
      dy = e.clientY - y0;
      sheet.style.transform = 'translateY(' + Math.max(-(sheetTopPx - 70), dy) + 'px)';
    });
    const end = () => {
      if (y0 == null) return;
      const v = dy; y0 = null;
      sheet.classList.remove('dragging');
      sheet.style.transform = '';
      if (Math.abs(v) < 6) setSize(sheet.dataset.size === 'full' ? 'half' : 'full');
      else if (v > 80) { if (sheet.dataset.size === 'full') setSize('half'); else closeSheet(); }
      else if (v < -50) setSize('full');
    };
    grab.addEventListener('pointerup', end);
    grab.addEventListener('pointercancel', end);
    grab.addEventListener('click', (e) => { if (e.detail === 0) setSize(sheet.dataset.size === 'full' ? 'half' : 'full'); });
  })();

  /* ================= INÍCIO ================= */
  function mapBoot() {
    initMap();
    if (!map) return;
    refreshPins();
    setTimeout(() => {
      map.invalidateSize({ pan: false });
      fitContext();
    }, 150);
  }
  function whenLeaflet(cb) {
    if (window.L) { cb(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    s.onload = cb; s.onerror = cb;
    document.head.appendChild(s);
  }
  function start() {
    renderRoteiro(); renderMetro(); renderLugares(); renderInfo(); renderChips(); renderNextBar();
    setTab(S.tab, true);
    const fm = $('[data-act="fab-metro"]'); if (fm) fm.classList.toggle('is-on', !!S.stations);
    const pn = $('#panel');
    pn.addEventListener('scroll', () => {
      if (isDesktop() || S.tab === 'mapa') return;
      const y = pn.scrollTop, c = $('#app').classList.contains('map-min');
      if (!c && y > (window.innerHeight < 700 ? 70 : 140)) setCollapsed(true); else if (c && y < 12) setCollapsed(false);
    }, { passive: true });
    whenLeaflet(mapBoot);
    if (S.geo) locateMe(false);
    netState();
    window.addEventListener('online', () => { netState(); fetchWx(false); });
    window.addEventListener('offline', netState);
    fetchWx(false);
    if (window.NYC_PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    setInterval(() => { const h = $('#hero'); if (h) h.outerHTML = heroHTML(); renderChips(); renderNextBar(); fetchWx(false); }, 60000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
